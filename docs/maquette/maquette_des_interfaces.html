<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2F4B">
<title>Répétiteur IA — Maquette interactive</title>
<style>
/* =========================================================
   RÉPÉTITEUR IA — FEUILLE DE STYLE
   Couleurs et dimensions principales facilement modifiables
   ========================================================= */
:root {
  --navy: #1B2F4B;
  --navy-light: #294664;
  --teal: #0E7C86;
  --teal-dark: #08666e;
  --teal-light: #e4f5f4;
  --bg: #f3f6fa;
  --surface: #ffffff;
  --text: #203047;
  --muted: #66768a;
  --border: #e1e7ef;
  --orange: #ef9b38;
  --red: #c44747;
  --green: #247c55;
  --radius: 17px;
  --shadow: 0 18px 60px rgba(20, 42, 67, .14);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background: #e9eef5;
  font-size: 14px;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #6ac5c7;
  outline-offset: 2px;
}
button:disabled { opacity: .5; cursor: not-allowed; }
.top-notice {
  padding: 10px 16px;
  text-align: center;
  background: var(--navy);
  color: white;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .2px;
}
.top-notice span { color: #80e2dd; }
.demo-header {
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 22px 15px;
}
.brand-line { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 15px;
  color: white;
  background: var(--teal);
  font-size: 24px;
}
.brand-line h1 { margin: 0; font-size: 23px; color: var(--navy); }
.brand-line p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.presentation-title {
  margin: 24px 0 10px;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--navy);
}
.presentation-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.presentation-tab {
  border: 1px solid #d4deea;
  color: #34465c;
  background: white;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  transition: .2s;
}
.presentation-tab:hover { border-color: var(--teal); color: var(--teal); }
.presentation-tab.active {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}
.workspace {
  display: flex;
  justify-content: center;
  padding: 20px 16px 42px;
}
.phone {
  width: 390px;
  max-width: 100%;
  height: 800px;
  max-height: calc(100dvh - 20px);
  min-height: 550px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  border: 7px solid #16263a;
  border-radius: 35px;
  background: var(--bg);
  box-shadow: var(--shadow);
}
.status-bar {
  height: 27px;
  flex-shrink: 0;
  background: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 17px;
  color: var(--navy);
  font-size: 11px;
  font-weight: 800;
}
.status-right { display: flex; gap: 5px; align-items: center; }
.app-header {
  flex-shrink: 0;
  background: white;
  padding: 11px 17px 14px;
  border-bottom: 1px solid var(--border);
}
.app-header-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.app-brand { display: flex; align-items: center; gap: 9px; }
.app-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: var(--teal-light);
  font-size: 19px;
}
.app-brand strong { display: block; color: var(--navy); font-size: 15px; }
.app-brand small { display: block; font-size: 10px; color: var(--muted); }
.icon-btn {
  border: 1px solid var(--border);
  background: white;
  width: 37px;
  height: 37px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 17px;
  position: relative;
  color: var(--navy);
}
.notification-dot {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e85c5c;
  border: 1px solid white;
}
.content {
  flex: 1;
  overflow-y: auto;
  padding: 17px 15px 22px;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #ccd7e4 transparent;
}
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: #ccd7e4; border-radius: 5px; }
.bottom-nav {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
  background: white;
  border-top: 1px solid var(--border);
}
.nav-item {
  border: 0;
  background: transparent;
  color: #738197;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 46px;
  border-radius: 10px;
}
.nav-item .nav-icon { font-size: 19px; line-height: 1.2; }
.nav-item.active { color: var(--teal); background: #eef8f7; }
h2 { margin: 0 0 7px; font-size: 21px; line-height: 1.25; color: var(--navy); }
h3 { margin: 0 0 6px; font-size: 15px; color: var(--navy); }
p { margin: 5px 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 11px; }
.tiny { font-size: 10px; }
.eyebrow {
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: .8px;
  font-weight: 800;
  font-size: 10px;
}
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.card.soft { background: #f7fafc; }
.card.teal { background: var(--teal-light); border-color: #cbeae7; }
.card.dark { background: var(--navy); color: white; border-color: var(--navy); }
.card.dark h3, .card.dark h2 { color: white; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 11px 13px;
  font-weight: 800;
  font-size: 12px;
  text-align: center;
  text-decoration: none;
  transition: background .15s, transform .15s;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--teal); color: white; }
.btn.primary:hover { background: var(--teal-dark); }
.btn.dark { background: var(--navy); color: white; }
.btn.secondary { background: #edf2f7; color: var(--navy); border-color: #dce4ed; }
.btn.outline { background: white; color: var(--teal); border-color: #a9d7d5; }
.btn.danger { background: #fff0f0; color: var(--red); border-color: #f3d1d1; }
.btn.white { background: white; color: var(--navy); }
.btn.full { width: 100%; }
.btn.small-btn { padding: 7px 10px; font-size: 11px; }
.btn-group { display: flex; flex-wrap: wrap; gap: 7px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 30px;
  padding: 4px 8px;
  font-size: 10px;
  font-weight: 800;
  background: #edf2f7;
  color: #53657b;
}
.pill.green { color: #176542; background: #e4f5ea; }
.pill.orange { color: #925313; background: #fff1dc; }
.pill.red { color: #a52e2e; background: #fdeaea; }
.pill.teal { color: var(--teal); background: var(--teal-light); }
.progress { height: 7px; background: #e7edf4; border-radius: 10px; overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 10px; background: var(--teal); transition: width .3s; }
.avatar {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  border-radius: 15px;
  background: #dff1ef;
  font-size: 23px;
  flex-shrink: 0;
}
.avatar.navy { background: #e6ecf5; }
.metric { font-size: 23px; font-weight: 900; color: var(--navy); line-height: 1.2; }
.metric-label { font-size: 10px; color: var(--muted); margin-top: 4px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; margin: 19px 0 10px; gap: 8px; }
.section-heading h3 { margin: 0; }
.text-link { border: 0; background: transparent; color: var(--teal); font-weight: 800; font-size: 11px; padding: 5px 0; }
input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea {
  display: block;
  width: 100%;
  border: 1px solid #d7e0e9;
  border-radius: 11px;
  background: white;
  padding: 11px;
  color: var(--text);
  min-height: 42px;
}
textarea { resize: vertical; min-height: 65px; }
label.field-label { display: block; margin: 12px 0 5px; color: #45566c; font-weight: 800; font-size: 11px; }
.field-hint { color: var(--muted); font-size: 10px; margin-top: 4px; }
.option {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
  cursor: pointer;
}
.option.selected { border-color: var(--teal); background: #eef9f8; }
.option input { margin-top: 4px; accent-color: var(--teal); }
.option strong { display: block; font-size: 12px; }
.option small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
.choice-tile {
  border: 1px solid var(--border);
  background: white;
  border-radius: 13px;
  padding: 11px 6px;
  text-align: center;
  color: var(--navy);
  font-weight: 800;
  font-size: 11px;
}
.choice-tile.selected { border: 2px solid var(--teal); background: #eef9f8; padding: 10px 5px; }
.choice-tile span { display: block; font-size: 22px; margin-bottom: 4px; }
.divider { height: 1px; background: var(--border); margin: 13px 0; }
.chat-bubble {
  padding: 11px 12px;
  border-radius: 15px;
  font-size: 12px;
  margin: 9px 0;
  max-width: 94%;
  overflow-wrap: anywhere;
}
.chat-bubble.ai { background: white; border: 1px solid var(--border); border-top-left-radius: 4px; }
.chat-bubble.user { background: var(--navy); color: white; margin-left: auto; border-top-right-radius: 4px; }
.chat-bubble.system { background: #fff7e8; border: 1px solid #f4dfba; color: #77501c; max-width: 100%; }
.chat-label { font-size: 10px; font-weight: 800; color: var(--teal); margin-bottom: 4px; }
.math-box { padding: 13px; text-align: center; border-radius: 12px; background: #f0f5fa; font-size: 19px; font-weight: 900; color: var(--navy); margin: 10px 0; }
.timer { font-size: 29px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--navy); }
.timer.running { color: var(--teal); }
.timer.ended { color: var(--red); }
.book-cover {
  min-height: 95px; border-radius: 12px; background: #e5eef8;
  display: grid; place-items: center; font-size: 31px;
}
.list-row { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid #edf0f4; }
.list-row:last-child { border-bottom: 0; }
.list-icon { width: 38px; height: 38px; border-radius: 11px; background: #edf3f8; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.list-main { flex: 1; min-width: 0; }
.list-main strong { display: block; font-size: 12px; }
.list-main small { display: block; font-size: 10px; color: var(--muted); }
.switch-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; }
.switch-line strong { display: block; font-size: 12px; }
.switch-line small { display: block; font-size: 10px; color: var(--muted); }
.switch { position: relative; width: 43px; height: 25px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; border-radius: 30px; background: #c9d2dd; transition: .2s; cursor: pointer;
}
.slider:before {
  content: ""; position: absolute; width: 19px; height: 19px; left: 3px; top: 3px;
  border-radius: 50%; background: white; transition: .2s; box-shadow: 0 1px 3px #0002;
}
.switch input:checked + .slider { background: var(--teal); }
.switch input:checked + .slider:before { transform: translateX(18px); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day { text-align: center; font-size: 10px; color: var(--muted); }
.day b { margin: 5px auto 0; display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; background: #edf1f6; color: var(--navy); font-size: 11px; }
.day.done b { background: #d9f0e2; color: #247c55; }
.day.today b { background: var(--teal); color: white; }
.toast {
  position: absolute; z-index: 20; bottom: 76px; left: 12px; right: 12px;
  background: var(--navy); color: white; padding: 12px 14px; border-radius: 12px;
  box-shadow: 0 5px 22px #0002; font-size: 12px; font-weight: 700;
  animation: appear .2s ease-out;
}
@keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.modal-backdrop {
  position: absolute; inset: 0; z-index: 30; background: #10243dcc;
  display: flex; align-items: center; justify-content: center; padding: 18px;
}
.modal {
  width: 100%; max-height: 85%; overflow-y: auto; border-radius: 20px;
  background: white; padding: 20px; box-shadow: 0 15px 50px #0003;
}
.modal h2 { font-size: 20px; }
.exam-question { padding: 12px; background: white; border: 1px solid var(--border); border-radius: 12px; margin: 10px 0; }
.exam-question label { display: flex; align-items: flex-start; gap: 7px; padding: 5px 0; font-size: 12px; }
.exam-question input { accent-color: var(--teal); margin-top: 3px; }
.empty-state { padding: 20px; text-align: center; color: var(--muted); }
.mini-note { font-size: 10px; color: var(--muted); }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.hidden { display: none !important; }
.footer-note { text-align: center; font-size: 10px; color: var(--muted); padding: 6px; }
@media (max-width: 540px) {
  body { background: var(--bg); }
  .top-notice { font-size: 11px; padding: 8px 10px; }
  .demo-header { padding: 14px 13px 9px; }
  .brand-line h1 { font-size: 19px; }
  .brand-line p { font-size: 11px; }
  .presentation-title { margin-top: 16px; }
  .presentation-tabs { gap: 6px; }
  .presentation-tab { padding: 8px 9px; font-size: 11px; }
  .workspace { padding: 0; }
  .phone {
    width: 100%; height: calc(100dvh - 0px); max-height: none; min-height: 0;
    border: 0; border-radius: 0; box-shadow: none;
  }
  .status-bar { height: 25px; }
  .content { padding-bottom: 18px; }
}
@media (max-width: 360px) {
  .grid2 { gap: 7px; }
  .card { padding: 11px; }
  .nav-item { font-size: 9px; }
}
@media (min-width: 541px) {
  .phone { height: 800px; max-height: none; }
}
</style>
</head>
<body>
<div class="top-notice">⚠️ <span>Maquette non fonctionnelle, données fictives</span> — Aucune donnée ni aucun paiement réel</div>

<header class="demo-header">

    <div>
      <h1>Répétiteur IA</h1>

<script>
/* =========================================================
   RÉPÉTITEUR IA — JAVASCRIPT
   Navigation, données fictives et interactions de démonstration.
   Les fonctionnalités ci-dessous ne contactent aucun serveur.
   ========================================================= */

// ---------- Configuration des écrans ----------
const screens = {
  onboarding: "Inscription et comptes",
  home: "Accueil",
  session: "Séance avec l'IA",
  search: "Recherche et import",
  exams: "Examens et calendrier",
  reports: "Bilans",
  plans: "Forfaits et paiement",
  parent: "Espace parent",
  profile: "Profil, hors-ligne et notifications"
};

const mainScreens = ["home", "session", "search", "exams", "profile"];
let currentScreen = "home";
let previousScreen = "home";

// ---------- État de démonstration ----------
const state = {

  sessionStarted: false,
  sessionMessages: [],
  sessionStatus: "Vérifié par un enseignant",
  reportText: "",
  distressDemo: false,
  selectedPlan: "week",
  selectedPayment: "mtn",
  customSubjects: ["Mathématiques"],
  customHours: 5,
  promoCode: "",
  prepaidCode: "",
  paymentConfirmed: false,
  examRunning: false,
  examEnded: false,
  examSeconds: 0,
  examDeadline: null,
  examAnswers: {},
  examSubmitted: false,
  examDuration: 300,
  economyMode: false,
  downloads: ["Mathématiques · Pythagore", "Français · Les figures de style"],
  downloaded: {},
  view: "student",
  dailyLimit: 120,
  blockedHours: true,
  deviceLimit: 2,
  purchaseApproval: true,
  conversationAccess: true,
  followRole: true,
  payerRole: true,
  notifications: true,
  customCountry: "Cameroun",
  query: "",
  searchType: "Tout",
  importedName: "",
  importedKind: "Photo",
  selectedSubject: "Mathématiques",
  profileMenu: false,
  renewal: true,
  timerExpiredPrompt: false,
  reportSent: false,
  toastTimer: null
};

const plans = {
  hour: { name: "À l'heure", price: 300, duration: "1 heure", minutes: 60 },
  day: { name: "À la journée", price: 700, duration: "1 jour", minutes: 180 },
  week: { name: "À la semaine", price: 2500, duration: "7 jours", minutes: 900 },
  month: { name: "Au mois", price: 7500, duration: "30 jours", minutes: 3600 },
  subject: { name: "Par matière", price: 1500, duration: "7 jours · 1 matière", minutes: 450 },
  exam: { name: "Jusqu'à l'examen", price: 5000, duration: "30 jours", minutes: 1800 }
};

let remainingMinutes = 375;
let sessionInterval = null;
let focusInterval = null;
let examInterval = null;
let toastTimeout = null;

// ---------- Outils d'affichage ----------
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
function money(value) {
  return Math.round(value).toLocaleString("fr-FR") + " FCFA";
}
function formatTime(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds));
  return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" +
    String(seconds % 60).padStart(2, "0");
}
function toast(message) {
  const host = $("#toastContainer");
  host.innerHTML = `<div class="toast" role="status">${escapeHTML(message)}</div>`;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => host.innerHTML = "", 3000);
}
function openModal(title, body, actions = "") {
  $("#modalContainer").innerHTML = `

        <div class="row between" style="margin-bottom:12px">
          <h2>${escapeHTML(title)}</h2>
          <button class="icon-btn" onclick="closeModal()" aria-label="Fermer">✕</button>

        ${actions ? `<div class="btn-group" style="margin-top:15px">${actions}</div>` : ""}

}
function closeModal() {
  $("#modalContainer").innerHTML = "";
}
function go(screen) {
  if (!screens[screen]) return;
  if (currentScreen !== screen) previousScreen = currentScreen;
  currentScreen = screen;
  render();
}
function navigate(screen) {
  go(screen);
}
function updatePresentationTabs() {

  ).join("");
}
function updateNav() {
  $$(".nav-item").forEach(button => {

    button.classList.toggle("active", currentScreen === key ||

function render() {

    plans: renderPlans,

function toggleSwitch(label, checked, action, description = "") {

function defaultSessionMessages() {
  return [
    {type:"ai", text:"Bonjour Aïcha ! Aujourd'hui, nous allons comprendre le théorème de Pythagore. 😊"},
    {type:"ai", text:"Dans un triangle rectangle, le carré de la longueur de l'hypoténuse est égal à la somme des carrés des deux autres côtés."},
    {type:"formula", text:"c² = a² + b²"},
    {type:"ai", text:"Imagine un triangle ABC rectangle en A. AB = 3 cm et AC = 4 cm. Le côté BC est l'hypoténuse. Comment trouver sa longueur ?"},
    {type:"exercise", text:"Exercice : calcule BC. Choisis ta réponse ou demande-moi un indice."}
  ];
}
function renderSession() {
  if (!state.sessionMessages.length) state.sessionMessages = defaultSessionMessages();
  const messages = state.sessionMessages.map(m => {
    if (m.type === "formula") return `<div class="math-box">${escapeHTML(m.text)}</div>`;
    if (m.type === "user") return `<div class="chat-bubble user">${escapeHTML(m.text)}</div>`;
    if (m.type === "system") return `<div class="chat-bubble system">${escapeHTML(m.text)}</div>`;
    if (m.type === "exercise") return `<div class="chat-bubble ai"><div class="chat-label">✏️ À toi de jouer</div>${escapeHTML(m.text)}</div>`;
    return `<div class="chat-bubble ai"><div class="chat-label">✦ Répétiteur IA</div>${escapeHTML(m.text)}</div>`;
  }).join("");
  let hint = "";
  if (state.hintLevel === 1) hint = `<div class="chat-bubble ai"><div class="chat-label">💡 Indice 1</div>Repère d'abord l'hypoténuse : c'est le côté opposé à l'angle droit. Ici, c'est BC.</div>`;
  if (state.hintLevel === 2) hint = `<div class="chat-bubble ai"><div class="chat-label">💡 Indice 2</div>Remplace les longueurs dans la formule : BC² = 3² + 4² = 9 + 16. Il reste à calculer la racine carrée de 25.</div>`;
  if (state.hintLevel >= 3) hint = `<div class="chat-bubble ai"><div class="chat-label">✅ Solution complète</div>BC² = 3² + 4² = 9 + 16 = 25. Donc BC = √25 = <strong>5 cm</strong>. Bravo ! Vérifie toujours les unités et l'angle droit.</div>`;
  return `
    <div class="row between"><div><div class="eyebrow">Mathématiques · 3ème</div><h2>Théorème de Pythagore</h2></div><span class="pill green">● En cours</span></div>
    <div class="row between" style="margin:10px 0">
      <span class="pill">${state.mode==="guide"?"🧭 Mode guide":"📖 Mode solution"}</span>
      <button class="btn secondary small-btn" onclick="toggleSessionMode()">${state.mode==="guide"?"Passer en mode solution":"Revenir au mode guide"}</button>
    </div>
    <div class="card" style="padding:10px 12px">
      <div class="row between"><span class="small muted">Temps de séance</span><span class="timer" id="sessionClock">${formatTime(state.sessionSeconds)}</span></div>
      <div class="row between" style="margin-top:5px"><span class="small muted">Contenu pédagogique</span><span class="pill ${state.sessionStatus==="Vérifié par un enseignant"?"green":"orange"}">${state.sessionStatus==="Vérifié par un enseignant"?"✓":"✦"} ${state.sessionStatus}</span></div>
    </div>
    <div id="chatHistory">${messages}${hint}</div>
    <div class="card soft">
      <h3>Ta réponse</h3>
      <div class="grid3">
        ${["4 cm","5 cm","7 cm"].map((answer,i)=>`<button class="choice-tile" onclick="answerExercise('${answer}')">${answer}</button>`).join("")}
      </div>
      <div class="btn-group" style="margin-top:10px">
        <button class="btn primary" onclick="explainMore()">💡 Explique-moi</button>
        <button class="btn secondary" onclick="startThinking()">⏱ Je réfléchis</button>
      </div>
      <div class="row between" style="margin-top:10px">
        <span class="small muted">Indices utilisés : ${Math.min(state.hintLevel,3)}/3</span>
        <button class="text-link" onclick="reportError()">⚑ Signaler une erreur</button>
      </div>
    </div>
    <div class="card">
      <h3>Besoin de parler ?</h3>
      <p class="small muted">Teste une réponse bienveillante en cas de détresse.</p>
      <button class="btn outline full" onclick="distressDemo()">💙 Démonstration de soutien</button>
    </div>
    <div class="card">
      <h3>Écrire à l'IA</h3>
      <textarea id="sessionInput" placeholder="Ex. : Pourquoi utilise-t-on le carré ?"></textarea>
      <button class="btn primary full" style="margin-top:8px" onclick="sendSessionMessage()">Envoyer (simulation)</button>
    </div>`;
}
function ensureSessionClock() {
  if (sessionInterval) return;
  sessionInterval = setInterval(() => {
    state.sessionSeconds++;
    if (currentScreen === "session") {
      const clock = $("#sessionClock");
      if (clock) clock.textContent = formatTime(state.sessionSeconds);
    }
  }, 1000);
}
function updateTimerDisplay() {
  const clock = $("#sessionClock");
  if (clock) clock.textContent = formatTime(state.sessionSeconds);
}
function toggleSessionMode() {
  state.mode = state.mode === "guide" ? "solution" : "guide";
  render();
  toast(state.mode === "guide" ? "Mode guide activé : cherche avant de voir la réponse." : "Mode solution activé.");
}
function explainMore() {
  if (state.hintLevel < 3) state.hintLevel++;
  else toast("Tu as déjà vu la solution complète.");
  render();
  const chat = $("#chatHistory");
  if (chat) chat.scrollIntoView({block:"end",behavior:"smooth"});
}
function answerExercise(answer) {
  state.sessionMessages.push({type:"user",text:"Je pense que la réponse est " + answer + "."});
  if (answer === "5 cm") {
    state.sessionMessages.push({type:"ai",text:"Exactement ! 🎉 3² + 4² = 25, et √25 = 5. Tu as trouvé la bonne réponse."});
    state.hintLevel = Math.max(0,state.hintLevel);
  } else {
    state.sessionMessages.push({type:"ai",text:"Pas tout à fait, mais c'est une bonne tentative. Rappelle-toi : BC² = 3² + 4². Essaie de calculer 9 + 16 avant de prendre la racine carrée."});
  }
  render();
}
function sendSessionMessage() {
  const input = $("#sessionInput");
  const message = input?.value.trim();
  if (!message) return toast("Écris d'abord une question.");
  state.sessionMessages.push({type:"user",text:message});
  state.sessionMessages.push({type:"ai",text:"Bonne question ! Dans cette maquette, je te conseille de revenir à la formule c² = a² + b² et de repérer les longueurs connues. Dans une vraie version, l'IA analyserait ta question."});
  render();
}
function startThinking() {
  if (state.focusRunning) return toast("Le minuteur de réflexion est déjà lancé.");
  state.focusRunning = true;
  state.focusEnded = false;
  state.focusDeadline = Date.now() + state.focusDuration * 1000;
  ensureSessionClock();
  if (focusInterval) clearInterval(focusInterval);
  focusInterval = setInterval(() => {
    const remaining = Math.max(0,Math.ceil((state.focusDeadline-Date.now())/1000));
    const timer = $("#focusClock");
    if (timer) {
      timer.textContent = formatTime(remaining);
      timer.classList.toggle("ended",remaining===0);
    }
    if (remaining <= 0) {
      clearInterval(focusInterval);
      focusInterval = null;
      state.focusRunning = false;
      state.focusEnded = true;
      state.timerExpiredPrompt = true;
      if (currentScreen === "session") showFocusEndModal();
    }
  },250);
  render();
  toast("Minuteur de réflexion lancé !");
}
function showFocusEndModal() {
  openModal("Temps écoulé ⏰", `
    <p>Ton temps de réflexion est terminé. Prends une respiration, puis choisis la suite.</p>

  `, `
    <button class="btn primary" onclick="closeModal();answerAfterThinking()">Répondre</button>
    <button class="btn secondary" onclick="closeModal();extendThinking()">Prolonger</button>
    <button class="btn outline" onclick="closeModal();requestThinkingHelp()">Demander de l'aide</button>
  `);
}
function answerAfterThinking() {
  state.timerExpiredPrompt = false;

}

  state.focusDuration = 60;

      <p class="mini-note">Aucun renouvellement ni débit automatique réel n'est activé ici.</p>
    </div>
    ${state.age>=13&&state.age<=17&&!state.parentConfirmed?`<div class="card" style="border-color:#f0d7a9;background:#fff9ee"><span class="pill orange">Paiement bloqué</span><p class="small">La confirmation du parent est requise pour ce profil adolescent.</p><button class="btn outline full" onclick="go('onboarding')">Terminer la confirmation parent</button></div>`:""}`;
}
function discountLabel() {
  const h=state.customHours;
  const d=h>=20?30:h>=10?20:h>=5?10:0;
  return d ? `Remise de démonstration : ${d}% (durée plus longue).` : "Prix indicatif sans remise supplémentaire.";
}
function toggleSubject(subject, checked) {
  state.customSubjects = checked
    ? [...new Set([...state.customSubjects,subject])]
    : state.customSubjects.filter(s=>s!==subject);
  render();
}
function setRenewal(value) {
  state.renewal=value;
  toast(value?"Renouvellement rapide activé (sans débit réel).":"Renouvellement rapide désactivé.");
}
function applyPromo() {
  state.promoCode=$("#promoInput")?.value.trim()||"";
  if (state.promoCode.toUpperCase()==="PROMO10") toast("Code fictif accepté : remise de 10% à titre de démonstration.");
  else toast("Code non reconnu dans la maquette.");
}
function applyPrepaid() {
  state.prepaidCode=$("#prepaidInput")?.value.trim()||"";
  if (state.prepaidCode.toUpperCase()==="TEST2026") {
    toast("Code fictif accepté.");
    openModal("Code prépayé validé", `<div class="card teal"><h3>Accès de démonstration</h3><p class="small">Ce code ne crédite aucun compte réel.</p></div>`, `<button class="btn primary full" onclick="closeModal()">Continuer</button>`);
  } else toast("Code prépayé fictif non reconnu.");
}
function startPayment() {
  if (state.age>=13&&state.age<=17&&!state.parentConfirmed) {
    toast("Paiement bloqué : confirmation parent requise.");
    return;
  }
  showPaymentConfirmation(state.selectedPlan,plans[state.selectedPlan].price,plans[state.selectedPlan].duration);
}
function startCustomPayment() {
  if (!state.customSubjects.length) return toast("Choisis au moins une matière.");
  if (state.age>=13&&state.age<=17&&!state.parentConfirmed) return toast("Paiement bloqué : confirmation parent requise.");
  showPaymentConfirmation("custom",getCustomPrice(),state.customHours+" heure(s) · "+state.customSubjects.join(", "));
}
function showPaymentConfirmation(key,price,duration) {
  const method={mtn:"MTN Mobile Money",orange:"Orange Money",card:"Carte bancaire"}[state.selectedPayment];
  openModal("Récapitulatif avant paiement", `
    <div class="card soft"><div class="row between"><span class="small muted">Formule</span><strong>${escapeHTML(key==="custom"?"Sur mesure":plans[key].name)}</strong></div><div class="row between" style="margin-top:8px"><span class="small muted">Durée / contenu</span><strong style="text-align:right">${escapeHTML(duration)}</strong></div><div class="row between" style="margin-top:8px"><span class="small muted">Mode de paiement</span><strong>${method}</strong></div><div class="divider"></div><div class="row between"><strong>Total indicatif</strong><span class="metric">${money(price)}</span></div></div>
    <p class="small">Avant de confirmer, vérifie les conditions de remboursement : remboursement possible dans les 7 jours si aucune minute payante n'a été consommée, selon la règle fictive de cette maquette.</p>
    <p class="mini-note">Simulation uniquement : aucun paiement n'est effectué.</p>
  `, `<button class="btn primary full" onclick="confirmPayment('${key}',${price},'${String(duration).replace(/'/g,"\\'")}')">Confirmer (simulation)</button>`);
}
function confirmPayment(key,price,duration) {
  state.paymentConfirmed=true;
  if(key!=="custom") state.selectedPlan=key;
  remainingMinutes = key==="custom" ? state.customHours*60 : plans[key].minutes;
  closeModal();
  openModal("Confirmation fictive ✓", `
    <div style="text-align:center;padding:12px"><div style="font-size:45px">🎉</div><h2>Tout est prêt !</h2><p class="muted small">Ceci est un reçu de démonstration.</p></div>
    <div class="card teal"><div class="row between"><span class="small">Montant simulé</span><strong>${money(price)}</strong></div><div class="row between" style="margin-top:8px"><span class="small">Formule</span><strong>${escapeHTML(key==="custom"?"Sur mesure":plans[key].name)}</strong></div><div class="row between" style="margin-top:8px"><span class="small">Référence</span><strong>DEMO-2026-001</strong></div></div>
    <p class="small muted">Aucun transfert d'argent réel n'a eu lieu.</p>
  `, `<button class="btn primary full" onclick="closeModal();go('home')">Retour à l'accueil</button>`);
}

// ---------- Écran 8 : espace parent ----------
function renderParent() {
  const childMode = state.view==="student";
  return `
    <div class="row between"><div><div class="eyebrow">Espace famille</div><h2>Suivi de ${escapeHTML(state.studentName)}</h2></div><span class="avatar">👨‍👩‍👧</span></div>
    <div class="card teal">
      <div class="row between"><div><h3>Vue ${childMode?"élève":"parent"}</h3><p class="small">Bascule pour découvrir les deux interfaces.</p></div><span class="pill">${childMode?"Élève":"Parent"}</span></div>
      <div class="grid2" style="margin-top:10px">
        <button class="btn ${childMode?"primary":"secondary"}" onclick="setView('student')">👧 Vue élève</button>
        <button class="btn ${!childMode?"primary":"secondary"}" onclick="setView('parent')">👨 Vue parent</button>
      </div>
    </div>
    ${childMode ? `
      <div class="card dark"><h3>Bonjour ${escapeHTML(state.studentName)} !</h3><p style="font-size:12px;color:#e3eaf4">Tu peux suivre tes progrès et choisir ta prochaine séance.</p><button class="btn white full" onclick="go('session')">Reprendre ma séance</button></div>
      ${cardLink("📚","Mes matières","Mathématiques, Français et Sciences","search")}
      ${cardLink("📊","Mes bilans","Scores et points à retravailler","reports")}
      ${cardLink("🎁","Mon forfait","Temps d'étude restant","plans")}
    ` : `
      <div class="grid2">
        <div class="card"><div class="metric">4 h 25</div><div class="metric-label">Temps d'étude cette semaine</div></div>
        <div class="card"><div class="metric">13,5/20</div><div class="metric-label">Moyenne estimée</div></div>
      </div>
      <div class="card">
        <h3>Progression par matière</h3>
        ${[["Mathématiques",72],["Français",61],["Sciences",48]].map(([name,p])=>`<div style="margin:12px 0"><div class="row between"><span class="small">${name}</span><strong class="small">${p}%</strong></div><div class="progress" style="margin-top:5px"><span style="width:${p}%"></span></div></div>`).join("")}
        <p class="mini-note">Indicateurs de démonstration, pas des mesures officielles.</p>
      </div>
      <div class="card"><h3>Points faibles à surveiller</h3><p class="small">• Mathématiques : racines carrées.</p><p class="small">• Français : figures de style.</p><button class="btn outline full" onclick="go('reports')">Consulter les bilans</button></div>
      <div class="card"><div class="row between"><div><h3>Forfait restant</h3><p class="small muted">Temps disponible</p></div><strong class="metric" style="font-size:19px">${Math.floor(remainingMinutes/60)} h ${remainingMinutes%60} min</strong></div><button class="btn secondary full" onclick="go('plans')">Gérer les achats</button></div>
      ${section("Contrôles parentaux")}
      <div class="card">
        <label class="field-label">Limite de temps par jour : <strong id="dailyLimitLabel">${state.dailyLimit} min</strong></label>
        <input type="range" min="30" max="240" step="15" value="${state.dailyLimit}" style="width:100%;accent-color:var(--teal)" oninput="state.dailyLimit=Number(this.value);$('#dailyLimitLabel').textContent=this.value+' min'">
        ${toggleSwitch("Horaires interdits",""+state.blockedHours==="true","setBlockedHours","Ex. : 21 h – 7 h")}
        <label class="field-label">Nombre maximal d'appareils</label>
        <select onchange="state.deviceLimit=Number(this.value);toast('Limite d’appareils mise à jour.')">${[1,2,3,4].map(n=>`<option value="${n}" ${state.deviceLimit===n?"selected":""}>${n} appareil(s)</option>`).join("")}</select>
        ${toggleSwitch("Autoriser les achats après validation",state.purchaseApproval,"setPurchaseApproval","Le parent valide les achats du compte.")}
      </div>
      <div class="card">
        <h3>Accès aux conversations</h3>
        <div class="row between"><div><strong class="small">9–12 ans</strong><p class="mini-note">Accès complet du parent</p></div><span class="pill green">Complet</span></div>
        <div class="divider"></div>
        <div class="row between"><div><strong class="small">13–17 ans</strong><p class="mini-note">Résumé seulement, selon les paramètres de protection</p></div><span class="pill teal">Résumé</span></div>
        <p class="mini-note">Les alertes de sécurité doivent protéger l'adolescent tout en respectant sa vie privée.</p>
      </div>
      <div class="card">
        <h3>Alertes parentales</h3>
        <div class="list-row"><span class="list-icon">⏳</span><div class="list-main"><strong>Fin de forfait</strong><small>Rappel avant épuisement</small></div><span class="pill orange">Activable</span></div>
        <div class="list-row"><span class="list-icon">📱</span><div class="list-main"><strong>Nouvel appareil</strong><small>Connexion inhabituelle</small></div><span class="pill">Sécurité</span></div>
        <div class="list-row"><span class="list-icon">💙</span><div class="list-main"><strong>Alerte de détresse niveau 2</strong><small>Signal minimal, sans détails privés de conversation</small></div><span class="pill red">Prioritaire</span></div>
      </div>
      <div class="card">
        <h3>Rôles du compte</h3>
        ${toggleSwitch("Parent payeur",state.payerRole,"setPayerRole","Peut gérer les paiements fictifs.")}
        ${toggleSwitch("Parent suiveur",state.followRole,"setFollowRole","Peut consulter les bilans autorisés.")}
      </div>
      <div class="card soft"><h3>🔐 Confidentialité</h3><p class="small muted">Les contrôles présentés sont illustratifs. Dans une vraie application, les permissions, les alertes de détresse et l'accès aux conversations doivent être définis de manière transparente, sécurisée et adaptée à l'âge.</p></div>
    `}
  `;
}
function setView(view) {
  state.view=view;
  render();
}
function setBlockedHours(value) { state.blockedHours=value; }
function setPurchaseApproval(value) { state.purchaseApproval=value; toast(value?"Validation parent requise pour les achats.":"Validation parent désactivée dans la maquette."); }
function setPayerRole(value) { state.payerRole=value; toast("Rôle payeur "+(value?"activé":"désactivé")+"."); }
function setFollowRole(value) { state.followRole=value; toast("Rôle suiveur "+(value?"activé":"désactivé")+"."); }

// ---------- Écran 9 : profil, hors-ligne et notifications ----------
function renderProfile() {
  return `
    <div class="row top">
      <div class="avatar" style="width:60px;height:60px;font-size:30px">👧🏽</div>
      <div style="flex:1"><div class="eyebrow">Mon compte</div><h2>${escapeHTML(state.studentName)}</h2><p class="small muted">${state.age} ans · ${escapeHTML(state.grade)} · ${escapeHTML(state.series)}</p><span class="pill green">● Profil fictif</span></div>
      <button class="icon-btn" onclick="go('onboarding')" aria-label="Modifier le profil">✎</button>
    </div>
    ${section("Mes informations")}
    <div class="card">
      <label class="field-label">Pays</label>
      <select onchange="state.country=this.value;toast('Pays mis à jour.')">${["Cameroun","Côte d'Ivoire","Sénégal","Bénin","Togo","Gabon","Congo","Tchad","Autre"].map(c=>`<option ${state.country===c?"selected":""}>${c}</option>`).join("")}</select>
      <label class="field-label">Classe</label>
      <select onchange="state.grade=this.value;toast('Classe mise à jour.')">${["6ème","5ème","4ème","3ème","2nde","1ère","Terminale","Université L1","Université L2","Université L3","Master"].map(g=>`<option ${state.grade===g?"selected":""}>${g}</option>`).join("")}</select>
      <label class="field-label">Langue d'interface</label>
      <select onchange="toast('Langue sélectionnée : '+this.value+' (traduction de maquette non activée).')"><option>Français</option><option>English</option></select>
      ${toggleSwitch("Mode économie de données",state.economyMode,"setEconomyMode","Réduit les téléchargements et les médias.")}
    </div>
    <div class="card">
      <div class="row between"><div><h3>Connexion</h3><p class="small muted">État du réseau simulé</p></div><span class="pill green" id="connectionBadge">● Connecté</span></div>
      <div class="row between" style="margin-top:8px"><span class="small">Contenus disponibles hors-ligne</span><strong>${state.downloads.length}</strong></div>
      <div class="progress" style="margin-top:8px"><span style="width:${Math.min(100,state.downloads.length*25)}%"></span></div>
      <p class="small muted" style="margin-top:10px">Reconnecte-toi dans 24 h pour garder ton accès hors-ligne.</p>
      <div class="btn-group"><button class="btn secondary" onclick="toggleConnection()">Simuler la connexion</button><button class="btn outline" onclick="toast('Synchronisation fictive terminée.')">Synchroniser</button></div>
    </div>
    ${section("Mes contenus téléchargés")}
    <div class="card">
      ${state.downloads.length ? state.downloads.map((name,i)=>`<div class="list-row"><span class="list-icon">📘</span><div class="list-main"><strong>${escapeHTML(name)}</strong><small>Disponible hors-ligne · ${state.economyMode?"version légère":"qualité standard"}</small></div><button class="btn danger small-btn" onclick="deleteDownload(${i})">Supprimer</button></div>`).join("") : `<div class="empty-state">Aucun contenu téléchargé.</div>`}
      <button class="btn primary full" style="margin-top:10px" onclick="downloadContent()">＋ Télécharger un contenu</button>
    </div>
    ${section("Centre de notifications")}
    <div class="card">
      ${toggleSwitch("Activer les notifications",state.notifications,"setNotifications","Rappels d'étude et alertes de forfait.")}
      <div class="divider"></div>
      <div class="list-row"><span class="list-icon">⏳</span><div class="list-main"><strong>Forfait bientôt terminé</strong><small>Premier rappel : 3 jours avant l'échéance</small></div><span class="pill orange">J−3</span></div>
      <div class="list-row"><span class="list-icon">🔔</span><div class="list-main"><strong>Rappel de forfait</strong><small>Deuxième rappel : 1 jour avant l'échéance</small></div><span class="pill orange">J−1</span></div>
      <div class="list-row"><span class="list-icon">📚</span><div class="list-main"><strong>Petit rappel d'étude</strong><small>Il est temps de faire ta séance de 20 minutes.</small></div><span class="pill teal">Étudier</span></div>
      <div class="list-row"><span class="list-icon">📐</span><div class="list-main"><strong>DS de maths dans 3 jours</strong><small>Pense à réviser Pythagore.</small></div><span class="pill">Agenda</span></div>
    </div>
    ${section("Autres espaces")}
    <div class="stack">
      ${cardLink("📊","Bilans de progression","Résultats et exercices ratés","reports")}
      ${cardLink("💳","Forfaits et paiement","Consulter les formules","plans")}
      ${cardLink("👨‍👩‍👧","Espace parent","Contrôles et suivi familial","parent")}
      ${cardLink("🔐","Changer de profil","Téléphone partagé et PIN","onboarding")}
    </div>
    <p class="footer-note">Version de démonstration · Aucun compte réel.</p>`;
}
function setEconomyMode(value) {
  state.economyMode=value;
  render();
  toast(value?"Mode économie de données activé.":"Mode économie de données désactivé.");
}
function setNotifications(value) {
  state.notifications=value;
  toast(value?"Notifications fictives activées.":"Notifications fictives désactivées.");
}
function toggleConnection() {
  const badge=$("#connectionBadge");
  if (!badge) return;
  const connected=badge.textContent.includes("Connecté");
  badge.textContent=connected?"○ Hors-ligne":"● Connecté";
  badge.className="pill "+(connected?"orange":"green");
  toast(connected?"Mode hors-ligne simulé.":"Connexion rétablie (simulation).");
}
function downloadContent() {
  const choices=["Mathématiques · Pythagore","Français · Les figures de style","Sciences · Électricité","Anglais · Vocabulaire"];
  openModal("Télécharger un contenu", `
    <p class="small muted">Sélectionne un cours fictif à rendre disponible hors-ligne.</p>
    <div class="stack">${choices.map((name,i)=>`<label class="option"><input type="radio" name="downloadChoice" value="${escapeHTML(name)}" ${i===0?"checked":""}><span><strong>${escapeHTML(name)}</strong><small>Version ${state.economyMode?"légère":"standard"}</small></span></label>`).join("")}</div>
  `, `<button class="btn primary full" onclick="confirmDownload()">Télécharger</button>`);
}
function confirmDownload() {
  const selected=$('input[name="downloadChoice"]:checked')?.value;
  if (!selected) return toast("Sélectionne un contenu.");
  if (!state.downloads.includes(selected)) state.downloads.push(selected);
  closeModal(); render();
  toast("Contenu ajouté aux téléchargements fictifs.");
}
function deleteDownload(index) {
  const name=state.downloads[index];
  state.downloads.splice(index,1);
  render();
  toast("Contenu supprimé : "+name);
}

// ---------- Navigation générale ----------
$("#presentationTabs").addEventListener("click",event=>{
  const button=event.target.closest("[data-presentation]");
  if(button) go(button.dataset.presentation);
});
$$(".nav-item").forEach(button=>button.addEventListener("click",()=>go(button.dataset.screen)));
$("#headerNotification").addEventListener("click",()=>go("profile"));

// ---------- Initialisation ----------
function updateClock() {
  const now=new Date();
  $("#statusTime").textContent=now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
updateClock();
setInterval(updateClock,30000);
ensureSessionClock();
render();
</script>
</body>
</html>
